name: Diagnose macOS seeded transition-state search

on:
  push:
    branches: [macos-ci-investigation]
    paths:
      - .github/workflows/diagnose-macos.yml
      - ci/diagnose-macos-nfev.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Seed trace (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 6e004b15e05922c242d6bf1f58b5cb2e11f198ee
          path: candidate
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
      - name: Create matching native dependency environment
        run: |
          conda create -y -n pele-nfev --override-channels -c conda-forge python=3.14 pip sundials eigen blas-devel pkg-config
      - name: Build the same installed-package configuration
        run: |
          conda activate pele-nfev
          if [ "$RUNNER_OS" = macOS ]; then export CC=gcc-15 CXX=g++-15 FC=gfortran-15; fi
          python --version
          python -m pip wheel "$GITHUB_WORKSPACE/candidate" --no-deps -v -Csetup-args=-Dnative=false --wheel-dir "$RUNNER_TEMP/wheel"
          python -m pip install "$RUNNER_TEMP"/wheel/*.whl numpy==2.5.4 scipy==1.18.1 networkx==3.7 sqlalchemy==1.4.54 threadpoolctl
      - uses: actions/upload-artifact@v5
        with:
          name: nfev-wheel-${{ matrix.os }}-cp314
          path: ${{ runner.temp }}/wheel/*.whl
          if-no-files-found: error
      - name: Trace the unchanged seed-zero fixture and fixed-candidate checks
        working-directory: ${{ runner.temp }}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          conda activate pele-nfev
          python "$GITHUB_WORKSPACE/ci/diagnose-macos-nfev.py" "$RUNNER_TEMP/nfev-trace.jsonl"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: nfev-trace-${{ matrix.os }}
          path: ${{ runner.temp }}/nfev-trace.jsonl
          if-no-files-found: error
