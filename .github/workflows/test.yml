name: Tests

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  pull_request:
    branches: ["master"]

env:
  BUILD_TYPE: Release

# a new push to a branch/PR cancels its older, still running workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.14"]  # only used by the python part
        # C++ and Python suites run as separate parallel jobs
        part: [cpp, python]
    name: ${{ matrix.part }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fail fast on hangs instead of the 6h default
    timeout-minutes: 30
    env:
      # meson uses ccache when it is on PATH. Release builds use -march=native; hash the resolved target so objects
      # cached on one runner CPU are never reused on a different CPU
      CCACHE_COMPILERCHECK: "%compiler% -v;%compiler% -march=native -Q --help=target"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.part }}
          max-size: 1G

      # the C++ tests need no Python: conda only for the python part
      - name: Set up Conda
        if: matrix.part == 'python'
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: false
          
      - name: Create conda environment
        if: matrix.part == 'python'
        shell: bash -l {0}
        run: |
          conda create -n pele-env python=${{ matrix.python-version }} -y
          conda activate pele-env
          python --version

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran libblas-dev liblapack-dev liblapacke-dev cmake libsuitesparse-dev lcov
          pipx install meson && pipx install ninja

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew list gcc@15 || brew install gcc@15
          brew list cmake || brew install cmake
          brew list openblas || brew install openblas
          brew list gettext || brew install gettext
          brew list suite-sparse || brew install suite-sparse
          brew list meson || brew install meson
          # homebrew gcc for C, C++ and Fortran (Apple clang has no OpenMP/Fortran)
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV
          echo "FC=gfortran-15" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install Python dependencies
        if: matrix.part == 'python'
        shell: bash -l {0}
        run: |
          conda activate pele-env
          python -m pip install --upgrade pip
          pip install meson-python meson ninja
          pip install "numpy>=1.24" "scipy>=1.9"
          pip install matplotlib networkx "cython>=3.0"
          pip install "sqlalchemy>=1.4,<2.0" munkres scikit-sparse
          pip install pytest pyyaml packaging
          # Install coverage tools
          pip install pytest-cov coverage

      - name: Debug Python Configuration
        if: matrix.part == 'python'
        shell: bash -l {0}
        run: |
          conda activate pele-env
          echo "=== Python Configuration Debug ==="
          python debug_python_config.py
          echo ""
          echo "=== Conda Environment ==="
          conda info --envs
          which python
          echo ""
          echo "=== Linking Test ==="
          echo 'int main(){return 0;}' > test.c
          gcc test.c -lpython${{ matrix.python-version }} -v 2>&1 || echo "Direct linking failed"
          rm -f test.c a.out

      - name: Get submodules
        run: git submodule update --init --recursive

      - name: Install sundials (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cd extern
          chmod +x sun_inst.sh
          ./sun_inst.sh Debug
          cd ..

      - name: Install sundials (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd extern
          chmod +x sun_inst.sh
          MACOSX_DEPLOYMENT_TARGET=12.0 CC=gcc-15 CXX=g++-15 ./sun_inst.sh Debug
          cd ..

      - name: Install Eigen
        run: |
          cd extern
          cp -r eigen/Eigen install/include

      - name: Build C++ tests
        if: matrix.part == 'cpp'
        run: |
          # coverage on Linux; the macOS runner's gcc has no working gcov setup here
          coverage=${{ matrix.os == 'ubuntu-24.04' && 'true' || 'false' }}
          meson setup build-tests -Dpython=disabled -Dtests=true -Dbuildtype=debug -Db_coverage=$coverage
          meson compile -C build-tests

      - name: Run C++ tests
        if: matrix.part == 'cpp'
        run: meson test -C build-tests --print-errorlogs

      - name: C++ coverage report (Linux)
        if: matrix.os == 'ubuntu-24.04' && matrix.part == 'cpp'
        run: |
          lcov --directory build-tests --capture --output-file coverage.info \
            --ignore-errors usage,inconsistent,empty,count,mismatch --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage.info "/usr/*" "*/cpp_tests/*" "*/extern/*" "*/Eigen/*" "*gtest*" "*gmock*" \
            --output-file coverage.info.cleaned --ignore-errors unused,empty,count,mismatch
          lcov --list coverage.info.cleaned

      - name: Build python library
        if: matrix.part == 'python'
        shell: bash -l {0}
        run: |
          conda activate pele-env
          # editable: pytest and coverage run on the source tree
          MACOSX_DEPLOYMENT_TARGET=12.0 pip install --no-build-isolation --no-deps -e . -v

      - name: Run python tests with coverage
        if: matrix.part == 'python'
        shell: bash -l {0}
        run: |
          conda activate pele-env
          export OMP_NUM_THREADS=1
          pytest pele/ -v --cov=pele --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-24.04'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.part == 'cpp' && './coverage.info.cleaned' || './coverage.xml' }}
          flags: ${{ matrix.part }}
          name: codecov-umbrella
          fail_ci_if_error: false

  # the README install: conda for the C/C++ libraries, `pip install .` for the rest,
  # then the tests against the installed package from outside the source tree
  pip-install:
    # fail fast on hangs instead of the 6h default
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # only the newest Python (unpinned, so new releases are picked up automatically);
        # Ubuntu uses the system compilers, macOS (no gfortran) conda's
        include:
          - {os: ubuntu-24.04, python: latest, compilers: ""}
          - {os: macos-latest, python: latest, compilers: compilers}
    runs-on: ${{ matrix.os }}
    name: pip-install (${{ matrix.os }}, python ${{ matrix.python }}${{ matrix.compilers && ', conda compilers' || '' }})
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""

      - name: Create environment
        run: |
          if [ "${{ matrix.python }}" = latest ]; then pin=""; else pin="=${{ matrix.python }}"; fi
          conda create -y -n pele -c conda-forge "python$pin" sundials eigen blas-devel ${{ matrix.compilers }}

      - name: pip install
        run: |
          conda activate pele
          python --version
          python -m pip install . -v -Csetup-args=-Dnative=false

      - name: Test installed package
        run: |
          conda activate pele
          python -m pip install pytest
          cd "$RUNNER_TEMP"
          OMP_NUM_THREADS=1 python -m pytest --pyargs pele -q
