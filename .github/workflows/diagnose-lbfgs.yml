name: Diagnose Intel LBFGS restart

on:
  push:
    branches: [codex/diagnose-lbfgs-intel]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
      - name: Install prebuilt native dependencies
        run: |
          conda create -y -n pele-diagnostic --override-channels -c conda-forge \
            python=3.11 pip sundials eigen blas-devel llvm-openmp pkg-config meson ninja
          brew list gcc@15 >/dev/null 2>&1 || brew install gcc@15
      - name: Build pele with the failed test runtime
        env:
          CC: clang
          CXX: clang++
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          conda activate pele-diagnostic
          export FC="$(brew --prefix gcc@15)/bin/gfortran-15"
          python -m pip install numpy==2.4.6 scipy==1.17.1 cython meson-python pytest
          python -m pip install --no-build-isolation . \
            -Csetup-args=-Dnative=false -Csetup-args=-Dlammps=disabled \
            -Csetup-args=-Dgui=disabled -Ccompile-args=-j2
      - name: Validate corrected restart and installed suite
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          conda activate pele-diagnostic
          cd "$RUNNER_TEMP"
          python -m pytest --pyargs pele.optimize.tests.test_lbfgs -q
          pele_gui_path=$(python -c 'from pathlib import Path; import pele; print(Path(pele.__file__).parent / "gui")')
          python -m pytest --pyargs pele -q --ignore="$pele_gui_path"
