name: Validate BFGS test tolerances

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Intel macOS Python 3.14 (${{ matrix.threads }} thread settings)
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        threads: [default, one]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the public wheel and matching dependencies
        run: python -m pip install --only-binary=pele pele==0.1.1 numpy==2.5.3 scipy==1.18.1 pytest
      - name: Validate the edited test and repeat BFGS
        env:
          THREADS_MODE: ${{ matrix.threads }}
        run: |
          python -u - <<'PYTHON'
          import base64, contextlib, hashlib, importlib.util, io, json, os, unittest
          from pathlib import Path
          if os.environ.get("THREADS_MODE") == "one":
              for name in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "VECLIB_MAXIMUM_THREADS"):
                  os.environ[name] = "1"
          source = base64.b64decode("")
          path = Path(os.environ["RUNNER_TEMP"]) / "test_wrappers.py"
          path.write_bytes(source)
          print("Changed test SHA256:", hashlib.sha256(source).hexdigest(), flush=True)
          import pele, pytest
          installed = Path(pele.__file__).resolve().parent
          assert not installed.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]))
          (installed / "optimize/tests/test_wrappers.py").write_bytes(source)
          assert pytest.main([str(path), "-q"]) == 0
          spec = importlib.util.spec_from_file_location("checked_wrappers", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          failures = []
          for index in range(60):
              result = unittest.TestResult()
              with contextlib.redirect_stdout(io.StringIO()):
                  module.TestMinimizers("test_bfgs_scipy").run(result)
              failures.extend({"index": index, "traceback": error} for _, error in result.failures + result.errors)
          print(json.dumps({"repeated_edited_test": {"runs": 60, "failures": failures}}), flush=True)
          assert not failures, failures
          PYTHON
      - name: Run the full installed core suite with the edited test
        if: always()
        env:
          THREADS_MODE: ${{ matrix.threads }}
        run: |
          python -u - <<'PYTHON'
          import os
          if os.environ.get("THREADS_MODE") == "one":
              for name in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "VECLIB_MAXIMUM_THREADS"):
                  os.environ[name] = "1"
          from pathlib import Path
          import pele, pytest
          package = Path(pele.__file__).resolve().parent
          raise SystemExit(pytest.main(["--pyargs", "pele", "--ignore", str(package / "gui"), "-q"]))
          PYTHON
