name: Release artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - meson.build
      - meson.options
      - README.rst
      - LICENSE
      - COPYING
      - LICENSE-THIRD-PARTY
      - ci/**
      - pele/**
      - source/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - meson.build
      - meson.options
      - README.rst
      - LICENSE
      - COPYING
      - LICENSE-THIRD-PARTY
      - ci/**
      - pele/**
      - source/**
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the validated source distribution and wheels to TestPyPI
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""
      - name: Create native dependency environment
        run: |
          conda create -y -n pele-release --override-channels -c conda-forge \
            python=3.11 pip sundials eigen blas-devel pkg-config
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          conda activate pele-release
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          assert tag in (version, f"v{version}"), f"Release tag {tag!r} does not match {version!r}"
          PYTHON
      - name: Build and check source distribution
        run: |
          conda activate pele-release
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist \
            -Csetup-args=-Dnative=false -Csetup-args=-Dlammps=disabled -Csetup-args=-Dgui=enabled
          python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: pele-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Portable wheels (${{ matrix.os }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v6
        with:
          name: pele-sdist
          path: dist
      - name: Extract validated source archive
        run: |
          mkdir "$RUNNER_TEMP/pele-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/pele-source" --strip-components=1
          test ! -e "$RUNNER_TEMP/pele-source/.git"
      - name: Install macOS compilers
        if: runner.os == 'macOS'
        run: |
          # Sonoma runtimes retain the macOS 14 minimum on macOS 15 runners.
          case "$(uname -m)" in
            arm64) pele_gcc_bottle_tag=arm64_sonoma; pele_gcc_bottle_sha=0f461330c058f4e9dce23dfa3942d3a6e716ad0555abf70cfff6bee4a2621ca5 ;;
            x86_64) pele_gcc_bottle_tag=sonoma; pele_gcc_bottle_sha=c5d05388d0bbd34d30cdd81a70db9d81c680712f96d4fa9a00bd7f43fc188d00 ;;
            *) exit 1 ;;
          esac
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew fetch --force-bottle --bottle-tag="$pele_gcc_bottle_tag" gcc@15
          pele_gcc_bottle_path=$(brew --cache --bottle-tag="$pele_gcc_bottle_tag" gcc@15)
          test "$(shasum -a 256 "$pele_gcc_bottle_path" | awk '{print $1}')" = "$pele_gcc_bottle_sha"
          if brew list gcc@15 >/dev/null 2>&1; then brew uninstall --ignore-dependencies gcc@15; fi
          brew install --force-bottle "$pele_gcc_bottle_path"
          printf '%s\n' 'CC=clang' 'CXX=clang++' \
            "FC=$(brew --prefix gcc@15)/bin/gfortran-15" >> "$GITHUB_ENV"
      - name: Build, repair and test portable wheels
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        run: |
          python -m pip install cibuildwheel==4.3.0 twine
          cd "$RUNNER_TEMP/pele-source"
          python -m cibuildwheel . --output-dir "$GITHUB_WORKSPACE/wheelhouse"
          python -m twine check --strict "$GITHUB_WORKSPACE"/wheelhouse/*.whl
      - uses: actions/upload-artifact@v5
        with:
          name: pele-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish distributions to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pele
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: pele-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish distributions to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    needs: [build, wheels]
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pele
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: pele-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
