name: Trace SciPy BFGS line-search failure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      REPEATS: '120'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install published wheels and matching dependencies
        run: python -m pip install --only-binary=pele,numpy,scipy pele==0.1.1 numpy==2.5.3 scipy==1.18.1 pytest
      - name: Prepare source-level probe
        run: |
          python - <<'PYTHON'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'bfgs-source-probe'
          folder.mkdir()
          (folder / 'probe.py').write_bytes(base64.b64decode(''))
          PYTHON
      - name: Trace unchanged SciPy
        env:
          PROBE_LABEL: mac-native
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-source-probe"
          python -u "$PROBE_DIR/probe.py" | tee "$PROBE_DIR/mac-native.log"
      - name: Test zero-step fallback in isolated SciPy process
        env:
          PROBE_LABEL: mac-zero-step-fallback
          PATCH_ZERO_STEP: '1'
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-source-probe"
          python -u "$PROBE_DIR/probe.py" | tee "$PROBE_DIR/mac-zero-step-fallback.log"
      - name: Test stricter Wolfe curvature with unchanged SciPy
        env:
          PROBE_LABEL: mac-curvature-01
          C2: '0.1'
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-source-probe"
          python -u "$PROBE_DIR/probe.py" | tee "$PROBE_DIR/mac-curvature-01.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bfgs-source-probe
          path: ${{ runner.temp }}/bfgs-source-probe
          retention-days: 7
