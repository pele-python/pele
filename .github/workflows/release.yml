name: Validate accurate LJ energy summation
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install published wheels and matching dependencies
        run: python -m pip install --only-binary=pele,numpy,scipy pele==0.1.1 numpy==2.5.3 scipy==1.18.1 pytest
      - name: Prepare isolated probes
        run: |
          python - <<'PYTHON'
          import base64, os
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'bfgs-exact-probe'
          folder.mkdir()
          for name, data in {'probe.py': '', 'exact.py': '', 'summation.cpp': ''}.items():
              (folder / name).write_bytes(base64.b64decode(data))
          PYTHON
      - name: Trace unchanged pele wrapper and SciPy
        env:
          CALL_WRAPPER: '1'
          REPEATS: '240'
          PROBE_LABEL: mac-wrapper-native
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-exact-probe"
          python -u "$PROBE_DIR/probe.py" | tee "$PROBE_DIR/mac-wrapper-native.log"
      - name: Obtain OpenMP headers for existing source
        run: brew install libomp
      - name: Compile serial adapter with existing exact sum
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-exact-probe"
          omp_prefix=$(brew --prefix libomp)
          cc -O3 -fPIC -I source -c source/xsum.c -o "$PROBE_DIR/xsum.o"
          cc -O3 -fPIC -I source -c source/pbinary.c -o "$PROBE_DIR/pbinary.o"
          c++ -std=c++17 -O3 -fPIC -shared -I source -I "$omp_prefix/include" "$PROBE_DIR/summation.cpp" "$PROBE_DIR/xsum.o" "$PROBE_DIR/pbinary.o" -o "$PROBE_DIR/pele-bfgs-summation-probe.so"
      - name: Repeat BFGS with accurate energy and unchanged native gradient
        env:
          REPEATS: '120'
        run: |
          export PROBE_DIR="$RUNNER_TEMP/bfgs-exact-probe"
          python -u "$PROBE_DIR/exact.py" | tee "$PROBE_DIR/mac-exact.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bfgs-exact-probe
          path: ${{ runner.temp }}/bfgs-exact-probe
          retention-days: 7
