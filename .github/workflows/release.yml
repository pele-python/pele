name: BFGS tolerance diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Intel macOS Python 3.14 (${{ matrix.threads }} threads)
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        threads: [default, one]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install the published wheel and matching dependencies
        run: python -m pip install --only-binary=pele pele==0.1.1 numpy==2.5.3 scipy==1.18.1
      - name: Capture convergence and line-search diagnostics
        env:
          THREADS_MODE: ${{ matrix.threads }}
        run: |
          python -u - <<'PYTHON'
          import json
          import os
          from decimal import Decimal, localcontext
          
          if os.environ.get("THREADS_MODE") == "one":
              for name in ("OPENBLAS_NUM_THREADS", "OMP_NUM_THREADS", "VECLIB_MAXIMUM_THREADS"):
                  os.environ[name] = "1"
          
          import numpy as np
          from scipy.optimize import fmin_bfgs, minimize
          from pele.optimize import _quench
          from pele.optimize.tests.test_wrappers import TestMinimizers
          
          
          def decimal_energy_gradient(coords):
              with localcontext() as context:
                  context.prec = 50
                  x = [Decimal.from_float(float(value)) for value in coords]
                  gradient = [Decimal(0) for _ in x]
                  energy = Decimal(0)
                  for i in range(31):
                      for j in range(i + 1, 31):
                          delta = [x[3 * i + k] - x[3 * j + k] for k in range(3)]
                          inv2 = 1 / sum(value * value for value in delta)
                          inv6 = inv2**3
                          energy += 4 * (inv6 * inv6 - inv6)
                          factor = 24 * inv2 * (inv6 - 2 * inv6 * inv6)
                          for k in range(3):
                              contribution = factor * delta[k]
                              gradient[3 * i + k] += contribution
                              gradient[3 * j + k] -= contribution
                  return energy, gradient
          
          
          summary = {}
          first_failure = None
          for tol in (1e-6, 1e-5):
              records = []
              for index in range(60):
                  case = TestMinimizers("test_bfgs_scipy")
                  case.setUp()
                  result = fmin_bfgs(case.pot.getEnergy, case.x0, fprime=case.pot.getGradient,
                                     gtol=tol, full_output=True, disp=False, maxiter=5000)
                  maximum = float(np.max(np.abs(result[2])))
                  records.append({"index": index, "max_gradient": maximum,
                                  "warnflag": int(result[6]), "energy": float(result[1]),
                                  "reference_energy_difference": float(result[1] - case.E)})
                  if maximum >= tol and first_failure is None:
                      first_failure = (case.pot, result[0].copy(), result[2].copy(), float(result[1]))
              summary[str(tol)] = {"runs": len(records),
                                   "failures": sum(row["max_gradient"] >= tol for row in records),
                                   "records": records}
          print(json.dumps({"repeated_exact_fixture": summary}), flush=True)
          
          if first_failure is not None:
              pot, coords, gradient, energy = first_failure
              precise_energy, precise_gradient = decimal_energy_gradient(coords)
              _, _, hessian = pot.getEnergyGradientHessian(coords)
              eigenvalues, eigenvectors = np.linalg.eigh(hessian)
              positive = eigenvalues > 1e-6
              projected = eigenvectors[:, positive].T @ gradient
              step = -(eigenvectors[:, positive] @ (projected / eigenvalues[positive]))
              trials = []
              for alpha in (1.0, 0.5, 0.25):
                  trial_energy, trial_gradient = pot.getEnergyGradient(coords + alpha * step)
                  precise_trial, _ = decimal_energy_gradient(coords + alpha * step)
                  trials.append({"alpha": alpha, "double_energy_change": float(trial_energy - energy),
                                 "decimal_energy_change": str(precise_trial - precise_energy),
                                 "max_gradient": float(np.max(np.abs(trial_gradient)))})
              restart = minimize(lambda x: np.longdouble(str(decimal_energy_gradient(x)[0])),
                                 coords.copy(), jac=pot.getGradient, method="BFGS",
                                 options={"gtol": 1e-6, "maxiter": 5000})
              print(json.dumps({"first_failure_analysis": {
                  "coords": coords.tolist(), "max_gradient": float(np.max(np.abs(gradient))),
                  "decimal_gradient_difference": float(max(abs(value - Decimal.from_float(float(actual)))
                      for value, actual in zip(precise_gradient, gradient))),
                  "energy_ulp": float(np.spacing(abs(energy))),
                  "predicted_newton_energy_drop": float(0.5 * np.sum(projected**2 / eigenvalues[positive])),
                  "newton_trials": trials,
                  "higher_precision_restart": {"status": int(restart.status),
                      "message": str(restart.message), "max_gradient": float(np.max(np.abs(restart.jac)))}}}), flush=True)
          PYTHON
