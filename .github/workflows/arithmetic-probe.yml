name: Probe Intel macOS arithmetic alignment

on:
  push:
    branches: [macos-ci-investigation]
    paths: [.github/workflows/arithmetic-probe.yml, .github/scripts/arithmetic-probe.py]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v6
        with:
          repository: pele-python/pele
          name: pele-wheels-macos-15-intel-x86_64-cp312
          run-id: 38182653643
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheels
      - name: Install the existing portable wheel and pinned runtime
        run: python -m pip install --only-binary=:all: "$RUNNER_TEMP"/wheels/*.whl numpy==2.5.4 scipy==1.18.1 threadpoolctl
      - name: Observe identical inputs at eight address alignments
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: |
          sysctl -n machdep.cpu.brand_string
          for trial in 1 2 3; do
            python "$GITHUB_WORKSPACE/.github/scripts/arithmetic-probe.py" "$RUNNER_TEMP/arithmetic-probe-${trial}.jsonl"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: arithmetic-probe-intel
          path: ${{ runner.temp }}/arithmetic-probe-*.jsonl
          if-no-files-found: error
