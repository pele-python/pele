name: Trace Intel macOS HEF trajectory

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/trace-hef.yml, .github/scripts/trace-hef.py]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v6
        with:
          name: pele-wheels-macos-15-intel-x86_64-cp312
          run-id: 38182653643
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/wheels
      - name: Install the existing portable wheel
        run: python -m pip install "$RUNNER_TEMP"/wheels/*.whl numpy==2.5.4 scipy==1.18.1 pytest threadpoolctl
      - name: Trace full suite and repeated accounting searches
        working-directory: ${{ runner.temp }}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          PYTHONPATH: ''
        run: |
          sysctl -n machdep.cpu.brand_string
          python "$GITHUB_WORKSPACE/.github/scripts/trace-hef.py" "$RUNNER_TEMP/hef-trace.jsonl"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hef-trajectory-${{ matrix.sample }}
          path: ${{ runner.temp }}/hef-trace.jsonl
          if-no-files-found: error
