[build-system]
requires = [
    "setuptools>=65",
    "wheel",
    "numpy>=1.26",  # f2py --backend meson
    "cython>=3",
    "cmake>=3.18",
    "meson",  # f2py backend
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "pele"
version = "0.1.0"
description = "Python energy landscape explorer: global optimization, minimization, basins of attraction"
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "scipy",
    "networkx",
    "matplotlib",
    "sqlalchemy>=1.4,<2",
    "munkres",
    "pyro4",
]

[project.optional-dependencies]
test = ["pytest"]
gui = ["pyqt5"]

[project.urls]
Homepage = "https://github.com/martiniani-lab/pele"
